# Screenshot Catalog configuration file - copy this to config.properties
# (same directory you launch the jar from) and uncomment/edit whatever you
# need. Everything here is optional - anything left commented out just uses
# its built-in default, same as if this file didn't exist at all.
#
# Precedence: an environment variable with the same name always overrides
# whatever's set here. This file is for "settings I want to keep for this
# machine / check into version control"; env vars are for "override just
# this one thing for this one run" (e.g. in a container or CI).
#
# To use a config file at a different path instead of ./config.properties,
# set the environment variable SCREENSHOT_CONFIG_FILE to point at it.

# The port the app listens on.

SCREENSHOT_PORT=8080

# H2 JDBC URL. The default keeps the database in ./data/ relative to
# wherever the jar is launched from.
# SCREENSHOT_DB_URL=jdbc:h2:file:./data/screenshot-catalog;AUTO_SERVER=TRUE
# SCREENSHOT_DB_USER=sa
# SCREENSHOT_DB_PASSWORD=

# Comma-separated list of directories a scan is allowed to point at. Default
# (if unset) is your home directory plus wherever you launched the jar from.
# SCREENSHOT_ALLOWED_ROOTS=/data/screenshots,/mnt/shared/Repository

# If set, every /api/* request must include this value as an X-API-Key
# header (or a key= query param, for plain <img>/<a> tags that can't send
# headers). Unset (the default) means no auth at all - fine for local
# testing, not recommended if this is reachable beyond your own machine.
# SCREENSHOT_API_KEY=

# Comma-separated list of extra allowed CORS origins, beyond the defaults
# (http://localhost:<port>, http://127.0.0.1:<port>, and the Vite dev server
# on :5173). Only matters if you're hosting the UI separately from the API.
# SCREENSHOT_ALLOWED_ORIGINS=https://screenshots.example.com

# Requests per minute, per IP, on /api/scan, /api/diff, and /api/diff/image.
# SCREENSHOT_RATE_LIMIT_PER_MINUTE=300
